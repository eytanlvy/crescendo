name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest
        timeout-minutes: 5
      - run: python -m pytest -q

  linux-x11-paste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -yq xvfb openbox xterm xclip xdotool x11-utils
      - name: Insertion réelle dans un xterm (Xvfb + openbox)
        run: |
          Xvfb :99 -screen 0 1280x800x24 & sleep 1
          export DISPLAY=:99
          openbox & sleep 1
          tests/manual/linux_x11_paste.sh


  linux-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Installation complète (petits modèles pour la CI)
        run: scripts/install-linux.sh --model tiny --llm qwen2.5:0.5b-instruct --no-systemd --shortcut none
      - name: Transcription de bout en bout (espeak-ng → whisper.cpp → Ollama)
        run: |
          sudo apt-get install -yq espeak-ng sox
          espeak-ng -v fr -w /tmp/raw.wav "Bonjour, ouvre une pull request et lance les tests avant ce soir."
          sox /tmp/raw.wav -r 16000 -c 1 -b 16 /tmp/sample.wav
          python3 bin/dictate /tmp/sample.wav --json | tee /tmp/result.json
          python3 -c "
          import json; r = json.load(open('/tmp/result.json'))
          assert r['status'] == 'ok', r
          assert len(r['text'].split()) >= 4, r['text']
          print('transcription :', r['text'], '| nettoyage :', r.get('cleanup_status'))"
      - name: Désinstallation
        run: |
          scripts/uninstall-linux.sh --ollama
          test ! -e ~/.local/share/voice-dictation && echo "données supprimées"
